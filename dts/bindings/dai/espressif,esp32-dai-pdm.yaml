description: |
  Espressif ESP32 Digital Audio Interface (DAI) for PDM Modulator/Demodulator.
  Supports Master and Slave modes, configurable oversampling ratios (64x/128x),
  PDM TX Sigma-Delta modulation, and PDM RX microphone decimation.

compatible: "espressif,esp32-dai-pdm"

include: [base.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  dai-index:
    type: int
    required: true
    description: Index of this DAI interface (1 for PDM0, 2 for PDM1, etc.).

  dmas:
    type: phandle-array
    description: TX and RX GDMA channels.

  dma-names:
    type: string-array
    description: Names of DMA channels ("tx", "rx").

  fifo-depth:
    type: int
    default: 32
    description: Depth of the PDM FIFO in 32-bit words.
